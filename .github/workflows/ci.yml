name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies${{ matrix.guzzle && format(', Guzzle {0}', matrix.guzzle) || '' }}
    runs-on: ubuntu-latest
    services:
      # Redis-backed tests skip themselves when no server is reachable.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        guzzle: ['']
        include:
          - php: '8.2'
            dependencies: lowest
            guzzle: ''
          - php: '8.5'
            dependencies: highest
            guzzle: '^7.10'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none

      - run: composer validate --strict

      - if: matrix.guzzle
        run: composer require --no-update --no-interaction "guzzlehttp/guzzle:${{ matrix.guzzle }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit

  platforms:
    name: PHP 8.5 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpunit

  static-analysis:
    name: PHPStan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - run: composer audit
